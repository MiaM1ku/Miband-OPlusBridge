name: Release

on:
  push:
    tags:
      - "[0-9]*-*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: Asia/Shanghai
      KEYSTORE_BASE64: ${{ secrets.OPLUSBAND_KEYSTORE_BASE64 }}
      OPLUSBAND_STORE_PASSWORD: ${{ secrets.OPLUSBAND_STORE_PASSWORD }}
      OPLUSBAND_KEY_ALIAS: ${{ secrets.OPLUSBAND_KEY_ALIAS }}
      OPLUSBAND_KEY_PASSWORD: ${{ secrets.OPLUSBAND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Decode keystore
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, sys
          raw = os.environ.get("KEYSTORE_BASE64", "")
          if not raw.strip():
              sys.exit("OPLUSBAND_KEYSTORE_BASE64 is empty")
          pathlib.Path(os.environ["RUNNER_TEMP"], "release.jks").write_bytes(base64.b64decode(raw))
          PY
      - name: Test and assemble
        env:
          OPLUSBAND_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Release notes from tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin tag "$GITHUB_REF_NAME" --force
            # contents includes the PGP signature; subject and body do not.
            git tag -l --format='%(contents:subject)%n%n%(contents:body)' "$GITHUB_REF_NAME" \
              | awk 'BEGIN{skip=0} /-----BEGIN PGP SIGNATURE-----/{skip=1} skip{next} {print}' \
              > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            printf '%s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
      - name: Publish GitHub Release
        id: source_release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
      - name: Read source release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json name --jq .name > release-name.txt
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          echo "name=$(cat release-name.txt)" >> "$GITHUB_OUTPUT"
      - name: Publish Xposed-Modules-Repo release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/io.github.miam1ku.mibandoplusbridge
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
